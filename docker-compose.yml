services:
  db:
    image: postgres:16-alpine
    container_name: profur_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: profur_db
      POSTGRES_USER: profur_user
      POSTGRES_PASSWORD: profur_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profur_user -d profur_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
