name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Code Quality & Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    name: Tests & Migrations Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: profur_db
          POSTGRES_USER: profur_user
          POSTGRES_PASSWORD: profur_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run backend checks (if backend exists)
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: profur_db
          DB_USER: profur_user
          DB_PASSWORD: profur_password
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "False"
          SECRET_KEY: "ci-test-secret-key"
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          if [ -f "backend/manage.py" ] || [ -f "manage.py" ]; then
            MANAGE_CMD="python manage.py"
            [ -f "backend/manage.py" ] && MANAGE_CMD="python backend/manage.py"
            $MANAGE_CMD makemigrations --check --dry-run
            $MANAGE_CMD test
          else
            echo "Kod bazasi hali qo'shilmagan. Dastlabki CI tekshiruvi muvaffaqiyatli."
          fi
